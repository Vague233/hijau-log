<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HijauLog - EUDR Compliance Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            navy: '#0f172a',
                            green: '#10b981',
                            greenLight: '#d1fae5',
                            dark: '#1e293b'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .map-pattern {
            background-color: #f1f5f9;
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 20px 20px;
        }
        /* Custom scrollbar for list */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;

        const supabaseUrl = 'https://sbmljwhzuivwmyihluv.supabase.co';
        const supabaseAnonKey = 'sb_publishable_oQ1jjgumCO5IQXCfx3MTHw_GRTMSCOM';
        const supabase = supabase.createClient(supabaseUrl, supabaseAnonKey);

        // --- ICONS ---
        const MapPinIcon = ({className}) => (<svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>);
        const CheckCircleIcon = ({className}) => (<svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>);
        const GlobeIcon = ({className}) => (<svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>);
        const QrCodeIcon = ({className}) => (<svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>);
        const DatabaseIcon = ({className}) => (<svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"></ellipse><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path></svg>);
        const DownloadIcon = ({className}) => (<svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>);
        const WifiIcon = ({className}) => (<svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12.55a11 11 0 0 1 14.08 0"></path><path d="M1.42 9a16 16 0 0 1 21.16 0"></path><path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path><line x1="12" y1="20" x2="12.01" y2="20"></line></svg>);
        const WifiOffIcon = ({className}) => (<svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="1" y1="1" x2="23" y2="23"></line><path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path><path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path><path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path><path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path><path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path><line x1="12" y1="20" x2="12.01" y2="20"></line></svg>);
        const XIcon = ({className}) => (<svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>);

        // --- MOCK DATA & UTILS ---
        const generateMockHash = () => Array.from({ length: 64 }, () => Math.floor(Math.random() * 16).toString(16)).join('');
        
        // --- COMPONENTS ---
        const MetricCard = ({ title, value, icon, valueColor = "text-slate-900" }) => (
            <div className="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm flex items-start justify-between">
                <div>
                    <p className="text-sm font-medium text-slate-500 mb-1">{title}</p>
                    <h3 className={`text-3xl font-bold tracking-tight ${valueColor}`}>{value}</h3>
                </div>
                <div className="p-3 bg-slate-50 rounded-xl border border-slate-100">
                    {icon}
                </div>
            </div>
        );

        const QRSvg = () => (
            <svg width="40" height="40" viewBox="0 0 100 100" className="text-slate-800">
                <rect x="10" y="10" width="25" height="25" fill="none" stroke="currentColor" strokeWidth="5"/>
                <rect x="15" y="15" width="15" height="15" fill="currentColor"/>
                <rect x="65" y="10" width="25" height="25" fill="none" stroke="currentColor" strokeWidth="5"/>
                <rect x="70" y="15" width="15" height="15" fill="currentColor"/>
                <rect x="10" y="65" width="25" height="25" fill="none" stroke="currentColor" strokeWidth="5"/>
                <rect x="15" y="70" width="15" height="15" fill="currentColor"/>
                <rect x="45" y="45" width="10" height="10" fill="currentColor"/>
                <rect x="60" y="45" width="10" height="10" fill="currentColor"/>
                <rect x="45" y="60" width="10" height="10" fill="currentColor"/>
                <rect x="75" y="60" width="15" height="15" fill="currentColor"/>
                <rect x="60" y="75" width="10" height="15" fill="currentColor"/>
                <rect x="85" y="45" width="5" height="10" fill="currentColor"/>
            </svg>
        );

        function App() {
            const [isOffline, setIsOffline] = useState(false);
            const [showForm, setShowForm] = useState(false);
            const [db, setDb] = useState([]);
            const [pendingSync, setPendingSync] = useState([]);
            const [isLoading, setIsLoading] = useState(true);
            
            // Form State
            const [lat, setLat] = useState("");
            const [lng, setLng] = useState("");
            const [jenisKayu, setJenisKayu] = useState("");

            useEffect(() => {
                async function fetchLahan() {
                    setIsLoading(true);
                    const { data, error } = await supabase
                        .from('lahan')
                        .select('*')
                        .order('created_at', { ascending: false });
                    
                    if (!error && data) {
                        setDb(data);
                    } else if (error) {
                        console.error('Error fetching data:', error);
                    }
                    setIsLoading(false);
                }
                fetchLahan();
            }, []);

            const handleAutoFill = () => {
                setLat((Math.random() * (5) - 8).toFixed(5));
                setLng((Math.random() * (15) + 105).toFixed(5));
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!lat || !lng || !jenisKayu) return;

                const newEntry = {
                    lat,
                    lng,
                    jenis_kayu: jenisKayu,
                    status: isOffline ? "Pending Sync" : "Verified",
                    hash: generateMockHash()
                };

                if (isOffline) {
                    newEntry.id = Date.now().toString();
                    setPendingSync([newEntry, ...pendingSync]);
                } else {
                    const { data, error } = await supabase
                        .from('lahan')
                        .insert([newEntry])
                        .select();

                    if (error) {
                        alert("Gagal menyimpan data ke Supabase: " + error.message);
                        return;
                    }
                    
                    if (data && data.length > 0) {
                        setDb([data[0], ...db]);
                    }
                }
                
                setLat("");
                setLng("");
                setJenisKayu("");
                setShowForm(false);
            };

            const allEntries = [...pendingSync, ...db];

            return (
                <div className="min-h-screen bg-slate-50 text-slate-800 font-sans selection:bg-brand-greenLight">
                    {/* Navigation */}
                    <nav className="bg-white border-b border-slate-200 shadow-sm sticky top-0 z-40">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <div className="bg-brand-navy p-2 rounded-lg">
                                    <MapPinIcon className="w-5 h-5 text-brand-green" />
                                </div>
                                <span className="font-bold text-xl tracking-tight text-brand-navy">HijauLog</span>
                            </div>
                            
                            <div className="flex items-center gap-8">
                                <div className="hidden md:flex items-center gap-6">
                                    <a href="#" className="text-sm font-semibold text-brand-navy border-b-2 border-brand-green py-5">Dashboard</a>
                                    <a href="#" className="text-sm font-medium text-slate-500 hover:text-slate-900 transition-colors">Lahan</a>
                                    <a href="#" className="text-sm font-medium text-slate-500 hover:text-slate-900 transition-colors">Ekspor</a>
                                </div>
                                
                                <div className="flex items-center gap-4 border-l border-slate-200 pl-8">
                                    <button 
                                        onClick={() => setIsOffline(!isOffline)} 
                                        className={`flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-semibold transition-all duration-300 ${isOffline ? 'bg-orange-100 text-orange-700 border border-orange-200' : 'bg-emerald-50 text-emerald-700 border border-emerald-100'}`}
                                    >
                                        {isOffline ? <WifiOffIcon className="w-3.5 h-3.5" /> : <WifiIcon className="w-3.5 h-3.5" />}
                                        {isOffline ? 'Offline Mode' : 'Online'}
                                    </button>
                                    <button className="text-sm font-medium text-red-500 hover:text-red-700 transition-colors">Keluar</button>
                                </div>
                            </div>
                        </div>
                    </nav>

                    <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
                        {/* Header */}
                        <div className="mb-10 flex flex-col md:flex-row md:items-end justify-between gap-4">
                            <div>
                                <h1 className="text-3xl font-extrabold text-brand-navy tracking-tight mb-2">EUDR Compliance Dashboard</h1>
                                <p className="text-slate-500 text-sm font-medium flex items-center gap-2">
                                    <GlobeIcon className="w-4 h-4" /> Sistem Geo-Tagging Traceability untuk EUDR Compliance
                                </p>
                            </div>
                            <div className="text-right">
                                <p className="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Status Kepatuhan Global</p>
                                <div className="inline-flex items-center gap-2 px-3 py-1 rounded-lg bg-emerald-50 border border-emerald-100 text-emerald-700 font-bold text-sm">
                                    <CheckCircleIcon className="w-4 h-4" /> 100% Terverifikasi
                                </div>
                            </div>
                        </div>

                        {/* Stats Grid */}
                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5 mb-10">
                            <MetricCard title="Total Lahan Terdaftar" value={db.length + pendingSync.length + 21} icon={<MapPinIcon className="w-6 h-6 text-brand-navy" />} />
                            <MetricCard title="Pohon Teregistrasi" value="1,247" icon={<DatabaseIcon className="w-6 h-6 text-brand-navy" />} />
                            <MetricCard title="Kode QR Dibuat" value={db.length + pendingSync.length + 86} icon={<QrCodeIcon className="w-6 h-6 text-brand-navy" />} />
                            <MetricCard title="Kepatuhan EUDR" value="100%" valueColor="text-brand-green" icon={<CheckCircleIcon className="w-6 h-6 text-brand-green" />} />
                        </div>

                        {/* Main Split */}
                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                            
                            {/* Left: Interactive Map */}
                            <div className="lg:col-span-2 relative h-[650px] bg-white rounded-3xl border border-slate-200 shadow-sm overflow-hidden flex flex-col">
                                <div className="p-5 border-b border-slate-100 flex items-center justify-between bg-white/80 backdrop-blur-md absolute top-0 left-0 right-0 z-10">
                                    <h2 className="font-bold text-brand-navy flex items-center gap-2">
                                        <GlobeIcon className="w-5 h-5 text-slate-400" /> Peta Distribusi Lahan
                                    </h2>
                                    <div className="flex gap-2">
                                        <span className="flex h-3 w-3 relative">
                                            <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-brand-green opacity-75"></span>
                                            <span className="relative inline-flex rounded-full h-3 w-3 bg-brand-green"></span>
                                        </span>
                                    </div>
                                </div>
                                <div className="flex-1 map-pattern relative w-full h-full flex items-center justify-center">
                                    {/* Mock Map Markers */}
                                    {allEntries.map((entry, i) => (
                                        <div key={entry.id || i} className="absolute flex flex-col items-center" style={{ top: `${20 + (i * 15)}%`, left: `${30 + (i * 20)}%` }}>
                                            <div className="group relative cursor-pointer">
                                                <MapPinIcon className={`w-8 h-8 drop-shadow-md transition-transform transform group-hover:scale-110 ${entry.status === 'Verified' ? 'text-brand-navy' : 'text-orange-500'}`} fill={entry.status === 'Verified' ? '#0f172a' : '#f97316'} />
                                                <div className="opacity-0 group-hover:opacity-100 absolute bottom-full mb-2 left-1/2 -translate-x-1/2 bg-brand-navy text-white text-xs py-1 px-2 rounded whitespace-nowrap transition-opacity shadow-lg z-20">
                                                    {entry.jenis_kayu}
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                    <div className="bg-white/90 backdrop-blur-sm px-6 py-3 rounded-full shadow-sm border border-slate-200 font-medium text-slate-600 flex items-center gap-3">
                                        <svg className="animate-spin h-5 w-5 text-brand-green" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                                        Memuat modul Leaflet.js...
                                    </div>
                                </div>
                            </div>

                            {/* Right: Actions & Database */}
                            <div className="flex flex-col gap-6 h-[650px]">
                                
                                {/* Aksi Cepat */}
                                <div className="bg-white rounded-3xl border border-slate-200 p-6 shadow-sm shrink-0">
                                    <h2 className="text-lg font-bold text-brand-navy mb-4">Aksi Cepat</h2>
                                    <button 
                                        onClick={() => setShowForm(true)}
                                        className="w-full bg-brand-navy hover:bg-brand-dark text-white font-semibold py-3 px-4 rounded-xl shadow-sm transition-colors flex items-center justify-center gap-2 mb-3"
                                    >
                                        <MapPinIcon className="w-5 h-5" /> Tambah Lahan Baru
                                    </button>
                                    <button className="w-full bg-white hover:bg-slate-50 text-slate-700 border border-slate-300 font-semibold py-3 px-4 rounded-xl shadow-sm transition-colors flex items-center justify-center gap-2">
                                        <DownloadIcon className="w-5 h-5" /> Ekspor Data
                                    </button>
                                </div>

                                {/* Database Lahan */}
                                <div className="bg-white rounded-3xl border border-slate-200 flex flex-col shadow-sm overflow-hidden flex-1">
                                    <div className="p-6 border-b border-slate-100 shrink-0">
                                        <h2 className="text-lg font-bold text-brand-navy flex items-center justify-between">
                                            Database Lahan
                                            <span className="text-xs font-semibold bg-slate-100 text-slate-500 px-2 py-1 rounded-md">{allEntries.length} Entri</span>
                                        </h2>
                                    </div>
                                    <div className="p-6 overflow-y-auto custom-scrollbar flex-1 flex flex-col gap-4">
                                        {pendingSync.length > 0 && (
                                            <div className="mb-2">
                                                <h3 className="text-xs font-bold text-orange-600 uppercase tracking-wider mb-3 flex items-center gap-2">
                                                    <WifiOffIcon className="w-3.5 h-3.5" /> Pending Sync (Local Storage)
                                                </h3>
                                                <div className="flex flex-col gap-4">
                                                    {pendingSync.map(entry => <DatabaseEntry key={entry.id} entry={entry} isPending />)}
                                                </div>
                                            </div>
                                        )}
                                        
                                        <div>
                                            <h3 className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3 flex items-center gap-2">
                                                <DatabaseIcon className="w-3.5 h-3.5" /> Tervalidasi Utama
                                            </h3>
                                            <div className="flex flex-col gap-4">
                                                {isLoading ? (
                                                    <p className="text-sm text-slate-500">Memuat data dari Supabase...</p>
                                                ) : db.length === 0 ? (
                                                    <p className="text-sm text-slate-500">Belum ada data lahan.</p>
                                                ) : (
                                                    db.map(entry => <DatabaseEntry key={entry.id} entry={entry} />)
                                                )}
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </main>

                    {/* Modal Form Tambah Lahan */}
                    {showForm && (
                        <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-3xl shadow-2xl border border-slate-200 w-full max-w-md overflow-hidden transform transition-all">
                                <div className="px-6 py-4 border-b border-slate-100 flex items-center justify-between bg-slate-50">
                                    <h3 className="text-lg font-bold text-brand-navy flex items-center gap-2">
                                        <MapPinIcon className="w-5 h-5 text-brand-green" /> Registrasi Lahan
                                    </h3>
                                    <button onClick={() => setShowForm(false)} className="text-slate-400 hover:text-slate-700 transition-colors">
                                        <XIcon className="w-5 h-5" />
                                    </button>
                                </div>
                                <div className="p-6">
                                    {isOffline && (
                                        <div className="mb-5 p-3 bg-orange-50 border border-orange-200 rounded-xl flex gap-3 text-orange-800 text-sm">
                                            <WifiOffIcon className="w-5 h-5 shrink-0" />
                                            <p>Anda sedang dalam mode <strong>Offline</strong>. Data akan disimpan secara lokal dan disinkronisasi saat koneksi tersedia.</p>
                                        </div>
                                    )}
                                    <form onSubmit={handleSubmit} className="flex flex-col gap-4">
                                        <div>
                                            <label className="block text-sm font-semibold text-slate-700 mb-1">Jenis Kayu</label>
                                            <input required type="text" value={jenisKayu} onChange={e=>setJenisKayu(e.target.value)} placeholder="Contoh: Kayu Jati" className="w-full border border-slate-300 rounded-xl px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-brand-green/20 focus:border-brand-green transition-all" />
                                        </div>
                                        <div className="grid grid-cols-2 gap-4">
                                            <div>
                                                <label className="block text-sm font-semibold text-slate-700 mb-1">Latitude</label>
                                                <input required type="text" value={lat} onChange={e=>setLat(e.target.value)} placeholder="-6.9140" className="w-full border border-slate-300 rounded-xl px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-brand-green/20 focus:border-brand-green transition-all text-sm font-mono" />
                                            </div>
                                            <div>
                                                <label className="block text-sm font-semibold text-slate-700 mb-1">Longitude</label>
                                                <input required type="text" value={lng} onChange={e=>setLng(e.target.value)} placeholder="107.6090" className="w-full border border-slate-300 rounded-xl px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-brand-green/20 focus:border-brand-green transition-all text-sm font-mono" />
                                            </div>
                                        </div>
                                        <button type="button" onClick={handleAutoFill} className="text-sm font-semibold text-brand-green flex items-center justify-center gap-2 py-2 bg-brand-greenLight/30 rounded-xl hover:bg-brand-greenLight/50 transition-colors">
                                            <MapPinIcon className="w-4 h-4" /> Ambil Koordinat Otomatis
                                        </button>
                                        
                                        <div className="mt-4 pt-4 border-t border-slate-100 flex gap-3">
                                            <button type="button" onClick={() => setShowForm(false)} className="flex-1 px-4 py-2.5 border border-slate-300 text-slate-700 font-semibold rounded-xl hover:bg-slate-50 transition-colors">Batal</button>
                                            <button type="submit" className="flex-1 px-4 py-2.5 bg-brand-navy text-white font-semibold rounded-xl hover:bg-brand-dark transition-colors shadow-sm">Simpan Data</button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // Sub-component for DB Entry
        const DatabaseEntry = ({ entry, isPending }) => (
            <div className={`p-4 rounded-2xl border transition-all ${isPending ? 'bg-orange-50/50 border-orange-100' : 'bg-slate-50 border-slate-200 hover:border-slate-300 hover:shadow-sm'}`}>
                <div className="flex justify-between items-start mb-3">
                    <div>
                        <h4 className="font-bold text-slate-800 flex items-center gap-2">
                            {entry.jenis_kayu} 
                        </h4>
                        <p className="text-xs text-slate-500 font-mono mt-0.5">[{entry.lat}, {entry.lng}]</p>
                    </div>
                    {isPending ? (
                        <span className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md text-[10px] font-bold bg-orange-100 text-orange-700 uppercase tracking-wider">
                            <WifiOffIcon className="w-3 h-3" /> Pending
                        </span>
                    ) : (
                        <span className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md text-[10px] font-bold bg-emerald-100 text-emerald-700 uppercase tracking-wider">
                            <CheckCircleIcon className="w-3 h-3" /> Verified
                        </span>
                    )}
                </div>
                
                <div className="bg-white rounded-xl p-3 border border-slate-100 flex items-center gap-3">
                    <div className="shrink-0 p-1 bg-slate-50 rounded-lg border border-slate-100">
                        <QRSvg />
                    </div>
                    <div className="min-w-0 flex-1">
                        <p className="text-[10px] font-semibold text-slate-400 uppercase tracking-wider mb-0.5">Digital Fingerprint (SHA-256)</p>
                        <p className="text-xs font-mono text-slate-600 truncate bg-slate-50 px-2 py-1 rounded border border-slate-100" title={entry.hash}>{entry.hash}</p>
                    </div>
                </div>
            </div>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
